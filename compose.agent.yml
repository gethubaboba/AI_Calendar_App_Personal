services:
  backend:
    environment:
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-http://host.docker.internal:8080/v1}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-calendar-qwen}
  web:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        CMD ["npm","run","dev"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      - backend
