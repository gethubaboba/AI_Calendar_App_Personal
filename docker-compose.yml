services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: planner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner_db
    ports:
      - "5432:5432"           # пробрасываем порт, чтобы можно было подключиться любым клиентом
    volumes:
      - postgres_data:/var/lib/postgresql/data  # данные сохраняются между перезапусками
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
    container_name: planner_backend
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"           # Swagger UI: http://localhost:8000/docs
    volumes:
      - ./backend:/app        # hot-reload: изменения кода сразу применяются
    depends_on:
      postgres:
        condition: service_healthy  # стартует только когда PostgreSQL готов

  # Prometheus scrapes the API and database exporter over the private Compose network.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: planner_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - postgres-exporter

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: planner_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://planner:planner@postgres:5432/planner_db?sslmode=disable
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    container_name: planner_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the root .env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

# Фронтенд (Next.js) запускается отдельно: cd frontend && npm run dev
# Он доступен на http://localhost:3000 и обращается к backend на http://localhost:8000
