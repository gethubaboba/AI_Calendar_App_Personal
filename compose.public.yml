# Run alongside docker-compose.yml to expose a narrow API entry point for Funnel.
services:
  public-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "public_proxy:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      PUBLIC_API_UPSTREAM: http://backend:8000
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      - backend
