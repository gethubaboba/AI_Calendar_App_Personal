name: Publish web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Validate public API address
        env:
          PAGES_API_URL: ${{ vars.PAGES_API_URL }}
        run: |
          if [[ ! "$PAGES_API_URL" =~ ^https://[a-zA-Z0-9.-]+\.ts\.net$ ]]; then
            echo 'Set repository variable PAGES_API_URL to the public HTTPS Tailscale Funnel origin (no trailing slash), for example https://my-pc.my-tailnet.ts.net' >&2
            exit 1
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build static site
        working-directory: frontend
        env:
          PAGES_BUILD: '1'
          NEXT_PUBLIC_API_URL: ${{ vars.PAGES_API_URL }}
        run: npm run build
      - name: Preserve Next.js asset paths
        run: touch frontend/out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
